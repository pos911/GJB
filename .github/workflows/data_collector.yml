name: Data Collector Pipeline

on:
  schedule:
    # 낮 13:25 KST = 04:25 UTC
    - cron: '25 4 * * *'
    # 새벽 01:25 KST = 16:25 UTC (전날)
    - cron: '25 16 * * *'
  workflow_dispatch:
    inputs:
      date_option:
        description: 'today 또는 yesterday'
        required: false
        default: 'today'

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Determine Date Option
        id: date_opt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DATE_OPTION=${{ github.event.inputs.date_option }}" >> $GITHUB_OUTPUT
          else
            HOUR_KST=$(TZ=Asia/Seoul date +%H)
            if [ "$HOUR_KST" -lt 6 ]; then
              echo "DATE_OPTION=yesterday" >> $GITHUB_OUTPUT
            else
              echo "DATE_OPTION=today" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Collector
        env:
          SECRET_JSON: ${{ secrets.SECRET_JSON }}
        run: python main.py --date ${{ steps.date_opt.outputs.DATE_OPTION }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git diff --cached --quiet || (git commit -m "Auto-update collected data $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')" && git push)
